      * { box-sizing: border-box; }
      html, body {

        overflow: hidden;
        background: #000;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      #stage {
        position: relative;
        width: 100%; height: 100%;
        overflow: hidden;
      }
      .video-wrapper {
        position: absolute;
        left: 0; top: 0;
        width: 1920px; height: 1080px;
        overflow: hidden;
      }
      .video-wrapper video {
        width: 100%; height: 100%;
        object-fit: cover;
      }
      .card-host {
        position: absolute;
        pointer-events: none;
        overflow: hidden;
      }
      .card-host .card {
        position: relative;
        width: 100%; height: 100%;
        overflow: hidden;
      }
      .card-host .char {
        display: inline-block;
        visibility: visible;
      }
    </style>
